[package]
name = "soundflow-receiver"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "soundflow"
crate-type = ["cdylib"]

[dependencies]
fusionplay-miplay-sdk = { path = "../upstream/src/FusionPlay.MiPlaySdk" }
jni = "0.21"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"

