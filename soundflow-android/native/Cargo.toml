[package]
name = "soundflow-receiver"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "soundflow"
crate-type = ["cdylib", "rlib"]

[dependencies]
fusionplay-miplay-sdk = { path = "../upstream/src/FusionPlay.MiPlaySdk" }
jni = "0.21"
serde_json = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
if-addrs = { path = "../upstream/src/FusionPlay.AndroidIfAddrs" }
libloading = "0.8"
rodio = { version = "0.22.2", features = ["symphonia-all"] }
roxmltree = "0.21"
socket2 = "0.6"
ureq = "3"

[build-dependencies]
cc = "1"
